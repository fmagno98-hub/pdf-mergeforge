name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m ruff check .
      - name: Prepare bundled veraPDF 1.30.2 and Temurin JRE 17
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor-downloads | Out-Null
          Invoke-WebRequest `
            -Uri "https://software.verapdf.org/rel/1.30/verapdf-greenfield-1.30.2-installer.zip" `
            -OutFile "vendor-downloads/verapdf-installer.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jre_x64_windows_hotspot_17.0.15_6.zip" `
            -OutFile "vendor-downloads/temurin-jre.zip"
          Expand-Archive "vendor-downloads/verapdf-installer.zip" "vendor-downloads/verapdf"
          Expand-Archive "vendor-downloads/temurin-jre.zip" "vendor-downloads/temurin"
          $installer = Get-ChildItem "vendor-downloads/verapdf" -Recurse -Filter "verapdf-izpack-installer-1.30.2.jar" | Select-Object -First 1
          $runtime = Get-ChildItem "vendor-downloads/temurin" -Directory | Select-Object -First 1
          .\scripts\prepare_bundled_validator.ps1 `
            -VeraPdfInstallerJar $installer.FullName `
            -TemurinJreDirectory $runtime.FullName
          python scripts/check_external_tools_not_bundled.py
      - run: python -m PyInstaller --clean --noconfirm PDF_MergeForge_onefile.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-MergeForge-Windows-x64
          path: dist/PDF-MergeForge-v1.1.0-Windows-x64.exe
