name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m PyInstaller --clean --noconfirm PDF_MergeForge_onefile.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-MergeForge-Windows-x64
          path: dist/PDF MergeForge.exe
