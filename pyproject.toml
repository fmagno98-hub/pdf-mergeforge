[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-mergeforge"
version = "1.3.0"
description = "Offline Windows PDF toolkit for merging, PDF/A export, and editable PDF-to-Word conversion"
requires-python = ">=3.12"
dependencies = ["PySide6==6.9.1", "pypdf==6.14.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]




[tool.ruff.lint.per-file-ignores]
"src/pdf_merger_desktop/pdf_to_word_service.py" = ["E501", "E701"]
"src/pdf_merger_desktop/word_worker.py" = ["E501", "E701"]
