[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-mergeforge"
version = "1.1.0"
description = "PDF MergeForge - fast, offline, secure PDF merging for Windows"
requires-python = ">=3.12"
dependencies = ["PySide6==6.9.1", "pypdf==6.14.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
